[project]
name = "telereason"
version = "0.1.0"
description = "Overnight robot-cell telemetry scan and live maintenance assistant on AMD Instinct MI300X."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "huggingface-hub",
    "pyarrow",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
