name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The job ids (backend, frontend) are the required status checks in the main ruleset.
# Renaming a job means updating the ruleset too. The image job is not required.
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      ENGINE: fake
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # setup-uv publishes no major-version tag, so pin the full release.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          working-directory: backend
      - run: uv sync --locked --group night
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # build runs tsc -b first, so it also covers the typecheck.
      - run: npm run build
      - run: npm test

  # Only proves the image builds; nothing is pushed.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker build .
