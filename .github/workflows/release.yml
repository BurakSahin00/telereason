name: Release image

# A version tag (v1.0, ...) publishes the fake-mode container to GHCR.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/buraksahin00/telereason
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Build
        run: >-
          docker build
          --label org.opencontainers.image.source=https://github.com/BurakSahin00/telereason
          --label org.opencontainers.image.licenses=MIT
          -t "$IMAGE:$GITHUB_REF_NAME" -t "$IMAGE:latest" .
      - name: Push
        run: docker push --all-tags "$IMAGE"
